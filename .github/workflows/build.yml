name: Build

on:
  push:
    branches: [ master, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is the baseline since 7.0.0 (maven.compiler release=25), so a JDK 21
        # job could not compile the reactor at all. Add newer JDKs here, never older.
        java: [ 25 ]
    name: JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -T1C verify
