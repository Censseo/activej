# The reactor compiles with maven.compiler release=25, so a JDK older than 25 cannot
# build it at all. JitPack provisions no JDK 25 — `jdk: - openjdk25` silently falls back
# to Java 8 (jitpack/jitpack.io#7547, closed stale without a fix), so 25 has to come from
# sdkman. `jdk:` below is only the bootstrap JVM; if the sdkman step ever breaks, the
# build fails loudly on the release=25 check rather than publishing wrong bytecode, and
# the `java -version` echo shows in the build log which JDK actually ran.
jdk:
  - openjdk21

before_install:
  - sdk install java 25-open
  - sdk use java 25-open
  - java -version

# JitPack's default build command is a plain `mvn install -DskipTests`, and the `extra`
# profile is activeByDefault=false — so without `-P extra` every artifact under extra/
# (activej-jsonrpc, activej-jsonrpc-http, activej-cube, activej-crdt, activej-dataflow,
# activej-ot, activej-redis, activej-etcd, activej-json, the extra launchers, …) is
# silently absent from the published build. Turning it on here rather than flipping the
# profile to activeByDefault keeps a plain `mvn verify` — and CI — free of the extra
# modules and their third-party dependencies, which is deliberate.
install:
  - mvn install -B -DskipTests -P extra
